# Part throttle with ramps: the pedal map between its deadzones.
# The torque request is table(rpm) x map(travel)^1.5, where travel is the
# pedal after the 9 % and 74 % deadzones (App/config/params.hpp). So 40 %
# pedal asks for about a third of the full-pedal torque and 60 % for about
# 70 %. The ramps are a driver's foot; they also keep the car model's
# driveline from ringing.
schema: lhre.vcu-sil-scenario.v1
description: Power up, then 40 % and 60 % pedal with ramps, lift, coast.
duration_ms: 8000

at:
  # Power up on the brake, as in launch.yml.
  - t_ms: 0
    accelerator: 0.0
    brake_psi: 350.0
    steering_deg: 0.0
    rtd_pressed: false
    hvc_state: NOT_ENERGIZED
    contactors_closed: false
    shutdown_loop_v: 24.0

  - t_ms: 200
    mark: precharge
    hvc_state: PRECHARGING

  - t_ms: 600
    mark: energized
    hvc_state: ENERGIZED
    contactors_closed: true

  - t_ms: 1000
    mark: rtd
    rtd_pressed: true

  - t_ms: 1500
    mark: brake-off
    brake_psi: {to: 0.0, ramp_ms: 150}

  - t_ms: 2000
    mark: pedal-40
    accelerator: {to: 0.4, ramp_ms: 300}

  # The ramp starts from the 0.4 the pedal holds.
  - t_ms: 4000
    mark: pedal-60
    accelerator: {to: 0.6, ramp_ms: 200}

  - t_ms: 6000
    mark: lift
    accelerator: {to: 0.0, ramp_ms: 300}
