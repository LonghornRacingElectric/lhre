# The reference drive, and the file to copy for a new one: power up, ready
# to drive on the brake, then full pedal from rest for 4 s, and coast.
# It is the stage 2 Launch, moved out of Python: the tests check that it
# gives the firmware the same inputs at every millisecond. The format is in
# boards/VCU/Sil/README.md, section Scenarios.
schema: lhre.vcu-sil-scenario.v1
description: Power up, ready to drive on the brake, full pedal from rest for 4 s, coast.
duration_ms: 7000

# Run conditions. --event-mode and --soc on the command line override them.
setup:
  event_mode: UNASSIGNED  # boots like the car: the ENDURANCE parameter set
  soc_start: 0.9          # at 1.0 the car model's pack accepts no regen

# What the run must show (README, Checks after the run). Every run is also
# held to the invariants, such as no torque outside DRIVE.
expect:
  # The power-up sequence, each state once: the VCU never leaves DRIVE.
  - states: [IDLE, PRECHARGE, TS_ACTIVE, RTD_WAIT, DRIVE]
  # The press is first sampled at 1002 and its 20 ms debounce passes at 1023.
  - reach: {state: DRIVE}
    from: rtd
    not_before_ms: 18
    within_ms: 24
  # No fault once the shutdown loop has settled (it reads UNKNOWN to 9 ms).
  - never: {fault: any}
  # Full pedal asks for the torque table's 210 N.m. The frame carries 0.1 N.m
  # steps, so this band holds 210.0 and nothing else. (Speed and DC power are
  # the car model's numbers: test_end_to_end.py checks them on the FMU.)
  - peak: {signal: torque_nm, between: [209.95, 210.05]}

at:
  # The start: HV off, shutdown loop closed, foot on the brake. 350 psi is
  # over RTD's 30 psi and clear of the brake-pressed hysteresis (on at 300,
  # off under 250 psi), where the previous state would decide.
  - t_ms: 0
    accelerator: 0.0
    brake_psi: 350.0
    steering_deg: 0.0
    rtd_pressed: false
    hvc_state: NOT_ENERGIZED
    contactors_closed: false
    shutdown_loop_v: 24.0

  - t_ms: 200
    mark: precharge
    hvc_state: PRECHARGING

  # The AIRs close as the HVC reports ENERGIZED; the VCU needs both.
  - t_ms: 600
    mark: energized
    hvc_state: ENERGIZED
    contactors_closed: true

  # The RTD switch is a toggle and stays on: releasing it leaves DRIVE.
  - t_ms: 1000
    mark: rtd
    rtd_pressed: true

  # Off the brake 500 ms before the pedal, long after its filter has fallen
  # under the brake-over-throttle threshold.
  - t_ms: 1500
    mark: brake-off
    brake_psi: 0.0

  # A step, as in stage 2, so trace.csv does not change. The car model's
  # driveline rings after a step; the other drives ramp the pedal.
  - t_ms: 2000
    mark: pedal-on
    accelerator: 1.0

  - t_ms: 6000
    mark: pedal-off
    accelerator: 0.0
