# The shutdown loop opens at speed with the pedal down, as when the driver
# hits a shutdown button. The VCU must cut torque from its own loop sense,
# leave DRIVE for FAULT and stay there while the loop is open. The AIR coils
# are in the loop, so the AIRs open too; the HVC reports it 20 ms later. The
# driver lifts 300 ms after the loop opens; the RTD toggle stays on.
schema: lhre.vcu-sil-scenario.v1
description: At 60 % pedal the shutdown loop opens; the AIRs open 20 ms later and the driver lifts 300 ms later.
duration_ms: 6000

# What the run must show (README, Checks after the run). Every run is also
# held to the invariants, such as zero torque on a torque-cut fault's tick.
expect:
  - states: [IDLE, PRECHARGE, TS_ACTIVE, RTD_WAIT, DRIVE, FAULT]
  # The loop's 10 ms debounce passes 12 ms after the sample that sees it open
  # (4002 to 4014): the VCU leaves DRIVE and cuts torque on that tick. The
  # default deadline for a loop change is 15 ms.
  - reach: {state: FAULT}
    from: loop-open
  - reach: {signal: torque_nm, at_most: 0.0}
    from: loop-open
  # The loop stays open, so the VCU stays in FAULT with SHUTDOWN_OPEN.
  - hold: {state: FAULT}
    from: loop-open
    after_ms: 15
  - hold: {fault: SHUTDOWN_OPEN}
    from: loop-open
    after_ms: 15

at:
  # Power up on the brake, as in launch.yml.
  - t_ms: 0
    accelerator: 0.0
    brake_psi: 350.0
    steering_deg: 0.0
    rtd_pressed: false
    hvc_state: NOT_ENERGIZED
    contactors_closed: false
    shutdown_loop_v: 24.0

  - t_ms: 200
    mark: precharge
    hvc_state: PRECHARGING

  - t_ms: 600
    mark: energized
    hvc_state: ENERGIZED
    contactors_closed: true

  - t_ms: 1000
    mark: rtd
    rtd_pressed: true

  - t_ms: 1500
    mark: brake-off
    brake_psi: {to: 0.0, ramp_ms: 150}

  - t_ms: 2000
    mark: roll-on
    accelerator: {to: 0.6, ramp_ms: 300}

  # 0 V is far under the loop's 16.6 V low threshold.
  - t_ms: 4000
    mark: loop-open
    shutdown_loop_v: 0.0

  - t_ms: 4020
    mark: airs-open
    hvc_state: NOT_ENERGIZED
    contactors_closed: false

  - t_ms: 4300
    mark: lift
    accelerator: {to: 0.0, ramp_ms: 200}
