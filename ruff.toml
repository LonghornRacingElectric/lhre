# Python lint for lhre's own code. Run: uv run --group lint ruff check
# Old violations are suppressed on their own line (`# noqa: <code>`), and
# RUF100 fails a noqa that no longer suppresses anything; see
# tools/lint/README.md.
#
# The rules are the ones that catch real bugs and unsafe habits, not style:
# formatting is left alone. autonomy/ is linted by ament_lint in its colcon
# tests (ADR-009), and simulation/bobsim is BobDyn's code, so both are out.

target-version = "py312"
extend-exclude = [
    "autonomy",
    "simulation/bobsim",
    # A body fragment that gen_orion pastes into a generated module; its
    # names are defined by the template around it.
    "apps/telemetry/scripts/gen_orion/models.py",
    # Generated by protoc; regenerate rather than edit.
    "apps/telemetry/stack/ingest/protobuf/*_pb2.py",
    "apps/telemetry/stack/ingest/protobuf/*_pb2_grpc.py",
]

[lint]
select = [
    "F",        # pyflakes: undefined names, unused imports and variables
    "E4",       # import placement
    "E7",       # statements: bare except, `== None`, lambda assignment
    "E9",       # syntax and IO errors
    "B",        # bugbear: mutable defaults, loop-variable closures, zip without strict
    "PLE",      # pylint errors: bad format and logging arguments
    "BLE001",   # `except Exception` that swallows everything
    "PLW1510",  # subprocess.run without check= silently ignores failures
    "RUF006",   # asyncio task dropped without a reference
    "ASYNC",    # blocking calls inside async code
    # Security footguns (bandit). Not all of S: asserts and plain
    # subprocess calls are fine in tools and tests.
    "S102",     # exec
    "S307",     # eval
    "S113",     # requests without a timeout hangs forever
    "S108",     # hardcoded /tmp paths (use tempfile / tmp_path)
    "S301",     # pickle
    "S306",     # tempfile.mktemp race
    "S324",     # md5/sha1 for security
    "S501",     # TLS verification off
    "S506",     # yaml.load without SafeLoader
    "S602", "S604", "S605",  # shell=True and os.system
    "RUF100",   # a noqa that no longer suppresses anything
]
