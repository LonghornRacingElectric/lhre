name: docs

# Builds the MkDocs site (docs live next to the code — see mkdocs.yml) and
# publishes it to GitHub Pages on main. PRs build it from ci.yml.
# Pages must be enabled once in repo settings: Settings → Pages → Source:
# "GitHub Actions".

on:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run. Every other run gets its
# own group, so no push, schedule or manual run is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Build site
        run: uv run --group docs mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    # Pages accepts one deployment at a time. Without this, a second
    # push to main while a deploy is still running fails with "in
    # progress deployment" instead of waiting (three merges in ten
    # minutes did exactly that on 2026-08-27). Never cancel a running
    # deploy; a newer pending one replaces an older pending one.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
