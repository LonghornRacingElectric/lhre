name: autonomy

# autonomy/ is a ROS 2 workspace built with colcon, outside Bazel
# (docs/architecture/009-autonomy-outside-bazel.md), so presubmit's
# `bazel test //...` never sees it. This job runs on the official Jazzy
# image (Ubuntu 24.04) rather than apt-installing ROS on the runner.

on:
  push:
    branches: [main]
    paths:
      - "autonomy/**"
      - ".github/workflows/autonomy.yml"
      - "simulation/bobsim"
      - "vehicle/**"
  pull_request:

# A new push to a PR cancels that PR's older run. Every other run gets its
# own group, so no push, schedule or manual run is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      autonomy: ${{ steps.check.outputs.autonomy }}
    steps:
      - name: Look for changes to autonomy/, vehicle/ or the BobSim pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -qE '^(autonomy/|simulation/bobsim$|vehicle/|\.github/workflows/autonomy\.yml$)' <<< "$files"; then
            echo "autonomy=true" >> "$GITHUB_OUTPUT"
          else
            echo "autonomy=false" >> "$GITHUB_OUTPUT"
            echo "No change to autonomy/, vehicle/ or the BobSim pin. Skipping."
          fi

  colcon:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.autonomy != 'false' }}
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
        working-directory: autonomy/ros2
    steps:
      - uses: actions/checkout@v7

      - name: Initialize dynamics dependency
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" submodule update --init --recursive simulation/bobsim
          echo "BOBSIM_ROOT=$GITHUB_WORKSPACE/simulation/bobsim" >> "$GITHUB_ENV"
          echo "BOBSIM_VEHICLE=$GITHUB_WORKSPACE/vehicle/vehicle.yml" >> "$GITHUB_ENV"

      # Dependencies come from each package.xml, so declaring one there is
      # enough. ros_gz is skipped: it pulls in all of Gazebo Harmonic and
      # nothing in CI launches a simulator (the demos need a display).
      # `rosdep update` pulls half a dozen YAML files from GitHub and fails
      # the whole command on one reset connection, hence the retries.
      - name: Install dependencies
        run: |
          apt-get update
          for attempt in 1 2 3; do
            rosdep update --rosdistro jazzy && break
            echo "rosdep update failed (attempt $attempt), retrying"
            sleep 10
          done
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "ros_gz_sim ros_gz_bridge ros_gz_interfaces"

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build

      # Package tests include ament lint and functional simulation checks.
      - name: Test
        id: test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --return-code-on-test-failure --event-handlers console_cohesion+

      - name: Report test results
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: colcon test-result --verbose
