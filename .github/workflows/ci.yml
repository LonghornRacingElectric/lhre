name: CI

# Every check runs from here: on PRs, on pushes to main, weekly and by hand.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Every other run gets its
# own group, so no push, schedule or manual run is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Jobs skip only when this job says their paths are untouched. Weekly and
  # manual runs, and pushes too large to list, run everything, except that
  # the weekly run leaves FourPost to simulation.yml's full regeneration. If this job
  # fails, every job runs and all-checks still fails. Which paths gate which
  # area is tools/ci/changes.py, tested by //tools/ci:changes_test.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      bazel: ${{ steps.check.outputs.bazel }}
      sim: ${{ steps.check.outputs.sim }}
      car: ${{ steps.check.outputs.car }}
      autonomy: ${{ steps.check.outputs.autonomy }}
      bevo: ${{ steps.check.outputs.bevo }}
      docs: ${{ steps.check.outputs.docs }}
      telemetry: ${{ steps.check.outputs.telemetry }}
      viewer: ${{ steps.check.outputs.viewer }}
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci

      - name: Find the areas this change touches
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          everything=()
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)') ;;
            push)
              compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA")
              files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$compare")
              [ "$(jq '.files | length' <<< "$compare")" -lt 300 ] || everything=(--everything) ;;
            *)
              files=""
              everything=(--everything) ;;
          esac
          python3 tools/ci/changes.py --event "$EVENT" "${everything[@]}" <<< "$files" | tee -a "$GITHUB_OUTPUT"

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With a BuildBuddy key, builds use the remote cache + executors and
      # stream results. Fork PRs don't get secrets, so they fall back to a
      # fully local build (hermetic toolchains make that work anywhere).
      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" > .bazelrc.user
          else
            echo "common --config=local" > .bazelrc.user
          fi
          echo "common --config=ci" >> .bazelrc.user

      - name: Check formatting
        run: bazel run //tools/format:check

  # Linters for code outside Bazel's view, pinned in pyproject's lint group.
  # Cheap, so it always runs. Old violations are suppressed inline; see
  # tools/lint/README.md.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Every step runs even after one fails, so one run shows every finding.
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Python (ruff)
        run: uv run --group lint ruff check --output-format=github

      # Scripts by extension, plus the one shebang-only script.
      - name: Shell scripts (shellcheck)
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z '*.sh' '*.bash' apps/BEVO/dashd/deploy/labwc-autostart ':!autonomy' ':!simulation/bobsim' | xargs -0 uv run --group lint shellcheck --severity=warning

      # A test that can't pass gets fixed or deleted, not switched off.
      - name: No switched-off tests
        if: ${{ !cancelled() }}
        run: |
          # skipif stays allowed: a platform guard isn't a switched-off test.
          # git grep exits 1 on no match; anything higher is a broken pathspec
          # that must fail the step, not read as clean.
          found=0
          scan() { rc=0; git grep -nE "$@" || rc=$?; [ "$rc" -le 1 ] || exit "$rc"; [ "$rc" -eq 1 ] || found=1; }
          scan 'flaky *= *True|enable_tests *= *False' -- '*BUILD' '*BUILD.bazel' '*.bzl' ':!tools/firmware/firmware_project.bzl'
          scan '(^|[^[:alnum:]_])(DISABLED_|GTEST_SKIP)' -- '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp'
          scan '(^|[^[:alnum:]_])(mark\.(skip|xfail)|unittest\.(skip|expectedFailure))([^[:alnum:]_]|$)|^[[:space:]]*@(skip|expectedFailure)([^[:alnum:]_]|$)' -- '*.py'
          if [ "$found" -eq 1 ]; then
            echo "::error::A test is switched off (flaky, enable_tests = False, DISABLED_, GTEST_SKIP, or a pytest/unittest skip); fix or delete it."
            exit 1
          fi

      - name: Simplified Technical English
        if: ${{ !cancelled() }}
        run: python3 tools/ste/ste.py

      # Workflow files are code too: expression typos, bad job references,
      # and shellcheck on every run: block.
      - name: GitHub workflows (actionlint)
        if: ${{ !cancelled() }}
        run: uv run --group lint actionlint

  # One job, one leg per OS. Linux builds and tests on the BuildBuddy
  # remote executors, then runs the sanitizers and coverage. Windows builds
  # fully locally (see .bazelrc: Bazel can't drive the Linux remote
  # executors from a Windows client) but still shares the remote cache, and
  # its short --output_user_root keeps Python codegen tools under Windows'
  # 260-char MAX_PATH, the same setup .bazelrc.user.example asks of Windows
  # dev machines.
  bazel:
    name: Bazel (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.bazel != 'false' }}
    strategy:
      # A Windows-only break still shows the Linux result, and vice versa.
      fail-fast: false
      matrix:
        # Linux's longest leg in the 80 runs before Nov 24 2026 took 23
        # minutes. 90 leaves room for a fork PR, which gets no BuildBuddy key
        # and so builds everything on the runner with no cache at all.
        # Linux's actions run remotely, so its build step keeps no outputs
        # (the telemetry images alone were ~1.9 GB to download) and its test
        # step builds only tests, whose logs the later steps read from
        # bazel-testlogs. Windows builds everything locally anyway.
        include:
          - os: Linux
            runner: ubuntu-latest
            timeout: 90
            build_flags: --remote_download_minimal
            test_flags: --build_tests_only
          - os: Windows
            runner: windows-latest
            timeout: 60
            build_flags: ""
            test_flags: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's merge commit and its base, for diff-cover.
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v9.0.0
        if: matrix.os == 'Linux'

      # With a BuildBuddy key, builds use the remote cache (+ executors on
      # Linux) and stream results. Fork PRs don't get secrets, so they fall
      # back to a fully local build (hermetic toolchains make that work
      # anywhere).
      - name: Configure Bazel
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          : > .bazelrc.user
          if [ "$RUNNER_OS" = Windows ]; then
            echo "startup --output_user_root=C:/_bzl" >> .bazelrc.user
          fi
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          else
            echo "common --config=local" >> .bazelrc.user
          fi
          echo "common --config=ci" >> .bazelrc.user

      # Runs on main write the cache that PRs restore: GitHub scopes
      # PR-created caches to their own branch, but caches created on main
      # are visible to every PR. Keyed on the files that pin external deps,
      # NOT the commit: an exact hit skips the multi-GB re-upload at job end
      # (GitHub caps the whole repo at 10 GB, LRU-evicted). Stale bazel-out
      # contents from older commits are safe (Bazel's action cache
      # invalidates correctly) and action results come from BuildBuddy
      # anyway; this cache exists to skip re-downloading and re-extracting
      # toolchains. Linux doesn't need it: its actions run remotely.
      - name: Cache Bazel
        if: matrix.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: "C:/_bzl"
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'requirements_lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build everything
        run: bazel build ${{ matrix.build_flags }} //...

      - name: Test everything
        run: bazel test ${{ matrix.test_flags }} //... 2>&1 | tee bazel-test.log

      - name: List failed tests
        if: failure()
        run: bash tools/ci/failed_tests_summary.sh bazel-test.log >> "$GITHUB_STEP_SUMMARY"

      # Each image's per-region memory table, copied from its size test's
      # log onto the run's summary page. !cancelled() so an over-budget
      # failure still shows which region blew it.
      - name: Summarize firmware memory use
        if: ${{ !cancelled() && matrix.os == 'Linux' }}
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          for label in $(bazel query 'attr(tags, firmware_size, tests(//...))'); do
            log="bazel-testlogs/${label#//}"
            log="${log/://}/test.log"
            [ -f "$log" ] || continue
            printf '#### `%s`\n\n' "$label"
            grep '^|' "$log" || true
            echo
          done | tee -a "$GITHUB_STEP_SUMMARY"

      # Host C++ tests again with undefined behavior trapping. trap_test is
      # the canary that proves the sanitizer is on (tools/ubsan/README.md).
      - name: Test host C++ under UBSan
        if: matrix.os == 'Linux'
        run: >-
          bazel test --config=ubsan
          //boards/... //drivers/... //lib/codegen/cpp/... //tools/ubsan:trap_test

      # And under ASan for memory errors; overflow_test is its canary
      # (tools/asan/README.md).
      - name: Test host C++ under ASan
        if: ${{ !cancelled() && matrix.os == 'Linux' }}
        run: >-
          bazel test --config=asan
          //boards/... //drivers/... //lib/codegen/cpp/... //tools/asan:overflow_test

      # Firmware line coverage from the host tests on the lines this PR
      # changes, reported on the summary page and never failing the build
      # (tools/coverage/README.md). The checkout is the PR merged into its
      # base, so HEAD^1 is the base and the diff is exactly this PR.
      - name: Measure firmware line coverage
        if: ${{ !cancelled() && matrix.os == 'Linux' && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: bazel coverage //boards/... //drivers/...

      - name: Report changed-line coverage
        if: ${{ !cancelled() && matrix.os == 'Linux' && github.event_name == 'pull_request' }}
        run: |
          report="$(bazel info output_path)/_coverage/_coverage_report.dat"
          uv run --only-group coverage diff-cover "$report" \
            --compare-branch=HEAD^1 \
            --format "markdown:$RUNNER_TEMP/diff-cover.md" ||
            echo "::warning::diff-cover failed, so this PR has no coverage report"
          cat "$RUNNER_TEMP/diff-cover.md" >> "$GITHUB_STEP_SUMMARY" || true
          # diff-cover skips files the report doesn't list, so a changed
          # source no host test links would read as fine. Board/, Core/ and
          # the STM32 LHAL backend only run on target and are never measured.
          changed=$(git diff --name-only --no-renames --diff-filter=AM HEAD^1 HEAD -- \
            'boards/*.cpp' 'boards/*.cc' 'drivers/longhorn/*.cpp' 'drivers/longhorn/*.cc' \
            'drivers/lhal/*.cpp' 'drivers/lhal/*.cc' \
            ':!boards/*/Board/*' ':!boards/*/Core/*' ':!drivers/lhal/stm32/*' \
            ':!*_test.*' ':!*_sim.*')
          # With no report every file would read as unlinked; say so once.
          if [ ! -s "$report" ]; then
            echo "::warning::no coverage report, so changed sources weren't checked for a host test"
            exit 0
          fi
          # Read the SF: lines once. Piping a big report into grep -q would
          # fail under pipefail when grep exits early (SIGPIPE), and warn
          # about files that are listed.
          sources=$(grep '^SF:' "$report" || true)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            grep -qF -- "$f" <<< "$sources" ||
              echo "::warning file=$f::no host test links this file, so its coverage isn't measured"
          done <<< "$changed"

      # The post-job cache save tars C:/_bzl; the Bazel server must not be
      # holding locks/open files in it when that happens.
      - name: Shut down Bazel
        if: ${{ always() && matrix.os == 'Windows' }}
        run: bazel shutdown

  sim-fast:
    name: Simulation fast checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sim != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LHRE_REQUIRE_GIT: "1"
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: simulation/bobsim
          file: simulation/bobsim/Dockerfile
          tags: lhre-simulation:local
          load: true
          cache-from: type=gha,scope=lhre-simulation
          cache-to: type=gha,mode=max,scope=lhre-simulation

      - name: Check that BobSim loads the vehicle
        run: make smoke

      - name: Check that a changed bundle member has a new bundle_id
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          make check-vehicle BASE="origin/$GITHUB_BASE_REF"

      # The container has no network, so the host fetches coverage.py,
      # pinned by hash. The report never fails the job.
      - name: Fetch coverage.py for the report
        continue-on-error: true
        run: >-
          pip download --no-deps --only-binary=:all: --platform any
          --python-version 3.11 --implementation py --require-hashes
          -r coverage-requirements.txt -d out/wheels

      - name: Run the unit and contract tests
        env:
          COVERAGE: "1"
        run: make unit

      - name: Report tools coverage
        if: ${{ !cancelled() }}
        run: |
          if [ -f out/coverage.md ]; then
            { echo "### Simulation tools coverage"; echo; cat out/coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no coverage report for simulation/tools"
          fi

  four-post:
    name: FourPost
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.car != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The same image and layer cache as Simulation fast checks, which runs
      # on every change this job runs on and so keeps the cache warm. Only
      # that job writes it, so the two don't export the same layers twice.
      # docker compose then finds lhre-simulation:local and builds nothing.
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: simulation/bobsim
          file: simulation/bobsim/Dockerfile
          tags: lhre-simulation:local
          load: true
          cache-from: type=gha,scope=lhre-simulation

      - name: Run FourPost on our car
        run: make car T=standard-eval-four-post

      - name: Check the FourPost acceptance
        run: make four-post-acceptance T=standard-eval-four-post

      - name: Upload the run record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: four-post-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            simulation/out/car/*/identity.json
            simulation/out/car/*/four_post_acceptance.json
            simulation/out/car/*/vehicle.yml
            simulation/out/car/*/*.log
            simulation/out/car/*/generated_results/*metrics*
            simulation/out/car/*/runs/*/*/manifest.json
            simulation/out/car/*/runs/*/*/overrides.txt
            simulation/out/car/*/runs/*/*/run.log
            simulation/out/car/*/runs/*/*/*_res.csv
            !simulation/out/car/**/*.tir

  autonomy:
    name: Autonomy (colcon)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.autonomy != 'false' }}
    runs-on: ubuntu-latest
    # Pinned by digest so a new upstream image can't change a PR's result
    # without a commit here. To update, take the jazzy-ros-base digest from
    # Docker Hub and bump it in its own PR (autonomy/ros2/README.md).
    container: ros:jazzy-ros-base@sha256:00b8d47a6e6384a2834e3d01fa87ae767876543baa574f2d64a75c04ea33c698
    defaults:
      run:
        shell: bash
        working-directory: autonomy/ros2
    steps:
      - uses: actions/checkout@v7

      - name: Initialize dynamics dependency
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" submodule update --init --recursive simulation/bobsim
          echo "BOBSIM_ROOT=$GITHUB_WORKSPACE/simulation/bobsim" >> "$GITHUB_ENV"
          echo "BOBSIM_VEHICLE=$GITHUB_WORKSPACE/vehicle/vehicle.yml" >> "$GITHUB_ENV"

      # Dependencies come from each package.xml, so declaring one there is
      # enough. ros_gz is skipped: it pulls in all of Gazebo Harmonic and
      # nothing in CI launches a simulator (the demos need a display).
      # `rosdep update` pulls half a dozen YAML files from GitHub and fails
      # the whole command on one reset connection, hence the retries.
      - name: Install dependencies
        run: |
          apt-get update
          for attempt in 1 2 3; do
            rosdep update --rosdistro jazzy && break
            echo "rosdep update failed (attempt $attempt), retrying"
            sleep 10
          done
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "ros_gz_sim ros_gz_bridge ros_gz_interfaces"

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build

      - name: Test
        id: test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --return-code-on-test-failure --event-handlers console_cohesion+

      - name: Report test results
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: colcon test-result --verbose

  bevo:
    name: BEVO Pi binaries
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.bevo != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With a BuildBuddy key, builds use the remote cache + executors and
      # stream results. Fork PRs don't get secrets, so they fall back to a
      # fully local build (hermetic toolchains make that work anywhere).
      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" > .bazelrc.user
          else
            echo "common --config=local" > .bazelrc.user
          fi
          echo "common --config=ci" >> .bazelrc.user

      - name: Cross-compile core daemons for Raspberry Pi OS
        run: bazel build //apps/BEVO:pi_core_binaries

      - name: Verify static AArch64 executables
        run: bazel test //apps/BEVO:pi_core_binary_test --test_output=errors

  # The kiosk UI is an npm project outside Bazel, so it gets its own job.
  bevo-frontend:
    name: BEVO dash frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.bevo != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/BEVO/dashd/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/BEVO/dashd/frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the jest tests
        env:
          CI: "true"
        run: npm test -- --watchAll=false

  # The viewer is an npm project outside Bazel, so it gets its own job, and
  # a change to the viewer alone runs only this one (and Docs for its .md).
  telemetry-viewer:
    name: Telemetry viewer
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.viewer != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/telemetry/analysis/database/viewer_tool
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/telemetry/analysis/database/viewer_tool/package-lock.json

      # --ignore-scripts skips postinstall, which wants the auth database.
      # ffmpeg-static's own install script fetches the ffmpeg binary the
      # video helper test converts with.
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild ffmpeg-static

      # vitest only loads the modules a test imports, so a component that
      # names an undefined variable passes it and still breaks `next build`.
      # The Prisma clients are generated first because src/lib/prisma imports
      # them; generating needs no database.
      - name: Type-check
        run: npm run typecheck

      - name: Run the vitest suite
        run: npm run test:driveday

      - name: Run the video helper test
        run: npm run test:video-helper

  job-runner:
    name: HIL dashboard
    timeout-minutes: 5
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.runner != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test dashboard API
        run: node --test apps/job_runner/*.test.mjs

  # On main, docs.yml builds and publishes the site instead.
  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.docs != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Build site
        run: uv run --group docs mkdocs build --strict

  # The server stack's integration tests need Kafka, Postgres and MQTT next
  # to them, which the remote executors cannot provide, so they are tagged
  # `manual` + `local` and run here against Docker Compose. Telemetry's
  # build and unit tests run in the Bazel jobs. The services need the
  # POSTGRES_USER, POSTGRES_PASSWORD, ELECTRIC_PWD, GRAFANA_PWD and
  # ANALYSIS_PWD repo secrets. The init scripts create databases, not
  # roles, so POSTGRES_USER must be "electric" and ELECTRIC_PWD must equal
  # POSTGRES_PASSWORD.
  telemetry:
    name: Telemetry
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.telemetry != 'false' }}
    runs-on: ubuntu-latest
    env:
      HAVE_SECRETS: ${{ secrets.POSTGRES_USER != '' && secrets.POSTGRES_PASSWORD != '' && secrets.ELECTRIC_PWD != '' && secrets.GRAFANA_PWD != '' && secrets.ANALYSIS_PWD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" > .bazelrc.user
          else
            echo "common --config=local" > .bazelrc.user
          fi
          echo "common --config=ci" >> .bazelrc.user

      - name: Build all telemetry images
        run: bazel build //apps/telemetry:all_images //lib/codegen/telemetry:server_schema

      # Every image all_images builds gets loaded and started once, the
      # optional processors (car_status, lap_timer, ...) as well as the core.
      - name: Load and smoke-test every image
        run: >-
          bazel test //apps/telemetry:core_smoke_tests
          //apps/telemetry:optional_smoke_tests --test_output=errors

      # Fork PRs and Dependabot get no repo secrets, so skipping is all they
      # can do. Anywhere else a missing secret means the integration tests
      # silently stopped running, so that fails instead of warning.
      - name: Check that the integration tests can run
        if: env.HAVE_SECRETS != 'true'
        env:
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$FORK" = true ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::warning::This run gets no repo secrets, so the telemetry integration tests are skipped. Only the images and smoke tests ran."
            exit 0
          fi
          echo "::error::Not every telemetry secret (POSTGRES_USER, POSTGRES_PASSWORD, ELECTRIC_PWD, GRAFANA_PWD, ANALYSIS_PWD) is set, so the integration tests can't run. Set them in the repo's Actions secrets."
          exit 1

      - name: Start services
        if: env.HAVE_SECRETS == 'true'
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ELECTRIC_PWD: ${{ secrets.ELECTRIC_PWD }}
          GRAFANA_PWD: ${{ secrets.GRAFANA_PWD }}
          ANALYSIS_PWD: ${{ secrets.ANALYSIS_PWD }}
        run: |
          docker network create telemetry_network || true
          docker volume create grafana_storage || true
          docker volume create telemetry_db || true
          docker volume create kafka_data || true
          ORION_DB_INIT_SQL="$GITHUB_WORKSPACE/bazel-bin/lib/codegen/telemetry/orion_db_init.sql"
          export ORION_DB_INIT_SQL
          {
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "ELECTRIC_PWD=$ELECTRIC_PWD"
            echo "GRAFANA_PWD=$GRAFANA_PWD"
            echo "ANALYSIS_PWD=$ANALYSIS_PWD"
            echo "ORION_DB_INIT_SQL=$ORION_DB_INIT_SQL"
          } > .env
          (cd apps/telemetry/stack/kafka && docker compose up -d --no-build --wait)
          (cd apps/telemetry/stack/ingest && docker compose up -d --no-build --wait)
          sleep 10
          docker ps

      # `local`-tagged tests run on this runner, not on the remote executors.
      - name: Integration tests
        if: env.HAVE_SECRETS == 'true'
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ELECTRIC_PWD: ${{ secrets.ELECTRIC_PWD }}
          GRAFANA_PWD: ${{ secrets.GRAFANA_PWD }}
          ANALYSIS_PWD: ${{ secrets.ANALYSIS_PWD }}
        run: |
          bazel test //apps/telemetry:integration_tests --test_output=errors \
            --test_env=POSTGRES_USER --test_env=POSTGRES_PASSWORD \
            --test_env=ELECTRIC_PWD --test_env=GRAFANA_PWD --test_env=ANALYSIS_PWD

      - name: Stop services
        if: always() && env.HAVE_SECRETS == 'true'
        env:
          ORION_DB_INIT_SQL: ${{ github.workspace }}/bazel-bin/lib/codegen/telemetry/orion_db_init.sql
        run: |
          (cd apps/telemetry/stack/ingest && docker compose down -v --remove-orphans) || true
          (cd apps/telemetry/stack/kafka && docker compose down -v --remove-orphans) || true
          docker network rm telemetry_network || true
          rm -f .env

  # The only required check, so the ruleset names one check, not ten.
  # Jobs skip only on an untouched area, and run if Changes fails.
  all-checks:
    name: All checks passed
    needs: [changes, format, lint, bazel, sim-fast, four-post, autonomy, bevo, bevo-frontend, docs, telemetry, telemetry-viewer, job-runner]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows

      - name: Fail unless every job passed or skipped an untouched area
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          status=0
          for job in $(sed -n '/^jobs:/,$p' .github/workflows/ci.yml | grep -E '^  [A-Za-z0-9_-]+:[[:space:]]*$' | tr -d ' :'); do
            [ "$job" = all-checks ] || jq -e --arg j "$job" 'has($j)' <<< "$NEEDS" > /dev/null \
              || { echo "::error::$job is not in the needs of all-checks, so nothing checks it"; status=1; }
          done
          jq -e '.changes.result == "success"' <<< "$NEEDS" > /dev/null \
            || { echo "::error::Changes failed, so a skipped job cannot be trusted"; status=1; }
          for job in $(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<< "$NEEDS"); do
            echo "::error::$job: $(jq -r --arg j "$job" '.[$j].result' <<< "$NEEDS")"
            status=1
          done
          exit $status
