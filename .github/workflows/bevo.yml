name: BEVO

on:
  pull_request:
    paths:
      - "apps/BEVO/**"
      - "lib/spec/**"
      - "lib/codegen/telemetry/**"
      - "lib/telemetry/**"
      - "platforms/**"
      - "toolchains/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/bevo.yml"
  workflow_dispatch:

jobs:
  raspberry-pi-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" > .bazelrc.user
          else
            echo "common --config=local" > .bazelrc.user
          fi
          echo "common --config=ci" >> .bazelrc.user

      - name: Cross-compile core daemons for Raspberry Pi OS
        run: bazel build //apps/BEVO:pi_core_binaries //apps/BEVO:pi_core_manifest //apps/BEVO:pi_core_image //apps/BEVO/updater:standalone

      - name: Verify static AArch64 executables
        run: bazel test //apps/BEVO:pi_core_binary_test //apps/BEVO:release_metadata_test //apps/BEVO/updater:updater_test //apps/BEVO/updater:package_test //apps/telemetry/schema_registry:registry_test //lib/telemetry:contract_test --test_output=errors
