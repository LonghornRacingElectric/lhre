name: presubmit

on:
  pull_request:

# A new push to a PR cancels that PR's older run. Every other run gets its
# own group, so no push, schedule or manual run is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # autonomy/ and simulation/ are outside Bazel (ADR-009, ADR-012), so a PR
  # that only touches them has nothing for the Bazel jobs to check. They are
  # gated on this job rather than on a `paths-ignore` filter because `bazel`
  # is a required check: a required check that never reports leaves the PR
  # stuck at "Expected", while a job skipped by `if:` reports success. Fails
  # closed: if this job errors, the Bazel jobs run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      bazel: ${{ steps.check.outputs.bazel }}
    steps:
      - name: Look for changes outside autonomy/ and simulation/
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          if grep -qvE '^(autonomy|simulation)/' <<< "$files"; then
            echo "bazel=true" >> "$GITHUB_OUTPUT"
          else
            echo "bazel=false" >> "$GITHUB_OUTPUT"
            echo "Only autonomy/ or simulation/ changed; skipping the Bazel jobs."
          fi

  bazel:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.bazel != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With a BuildBuddy key, builds use the remote cache + executors and
      # stream results. Fork PRs don't get secrets, so they fall back to a
      # fully local build (hermetic toolchains make that work anywhere).
      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" > .bazelrc.user
          else
            echo "common --config=local" > .bazelrc.user
          fi
          echo "common --config=ci" >> .bazelrc.user

      - name: Build everything
        run: bazel build //...

      - name: Test everything
        run: bazel test //...

      # Each image's per-region memory table, copied from its size test's
      # log onto the run's summary page. !cancelled() so an over-budget
      # failure still shows which region blew it.
      - name: Summarize firmware memory use
        if: ${{ !cancelled() }}
        run: |
          for label in $(bazel query 'attr(tags, firmware_size, tests(//...))'); do
            log="bazel-testlogs/${label#//}"
            log="${log/://}/test.log"
            [ -f "$log" ] || continue
            printf '#### `%s`\n\n' "$label"
            grep '^|' "$log" || true
            echo
          done | tee -a "$GITHUB_STEP_SUMMARY"

      # Host C++ tests again with undefined behavior trapping. trap_test is
      # the canary that proves the sanitizer is on (tools/ubsan/README.md).
      - name: Test host C++ under UBSan
        run: >-
          bazel test --config=ubsan
          //boards/... //drivers/... //lib/codegen/cpp/... //tools/ubsan:trap_test

  # Windows builds run fully locally (see .bazelrc: Bazel can't drive the
  # Linux remote executors from a Windows client) but still share the
  # remote cache. The short --output_user_root keeps Python codegen tools
  # under Windows' 260-char MAX_PATH — same setup the .bazelrc.user.example
  # asks of Windows dev machines.
  bazel-windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.bazel != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Configure Bazel
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          echo "startup --output_user_root=C:/_bzl" > .bazelrc.user
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          else
            echo "common --config=local" >> .bazelrc.user
          fi
          echo "common --config=ci" >> .bazelrc.user

      # Keyed on the files that pin external deps, NOT the commit: an
      # exact hit skips the multi-GB re-upload at job end (GitHub caps the
      # whole repo at 10 GB, LRU-evicted). Stale bazel-out contents from
      # older commits are safe — Bazel's action cache invalidates
      # correctly — and action results come from BuildBuddy anyway; this
      # cache exists to skip re-downloading and re-extracting toolchains.
      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: "C:/_bzl"
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'requirements_lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build everything
        run: bazel build //...

      - name: Test everything
        run: bazel test //...

      # The post-job cache save tars C:/_bzl; the Bazel server must not be
      # holding locks/open files in it when that happens.
      - name: Shut down Bazel
        if: always()
        run: bazel shutdown
