[package]
name = "bevo-local"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "sensor_proto"
path = "lib.rs"

[dependencies]
anyhow = "1.0"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rumqttc = { version = "0.24", default-features = false }
tungstenite = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3.0"

[build-dependencies]
prost = "0.12"
prost-build = "0.12"
prost-types = "0.12"
serde_json = "1.0"

[[bin]]
name = "cand"
path = "cand/main.rs"

[[bin]]
name = "mock_main"
path = "cand/mock_main.rs"

[[bin]]
name = "debugd"
path = "debugd/main.rs"

[[bin]]
name = "dashd"
path = "dashd/main.rs"

[[bin]]
name = "loggerd"
path = "loggerd/main.rs"

[[bin]]
name = "publishd"
path = "publishd/main.rs"
