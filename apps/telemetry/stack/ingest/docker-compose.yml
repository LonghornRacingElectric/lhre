services:
  query_gateway:
    image: ${TELEMETRY_QUERY_GATEWAY_IMAGE:-lhre/telemetry-query-gateway:dev}
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - path: ../../../../.env
        required: true
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUERY_CACHE_DIR: /cache
      QUERY_RING_BYTES: ${QUERY_RING_BYTES:-67108864}
      QUERY_BASELINE_BYTES: ${QUERY_BASELINE_BYTES:-67108864}
      QUERY_L1_BYTES: ${QUERY_L1_BYTES:-0}
      QUERY_L2_BYTES: ${QUERY_L2_BYTES:-0}
      QUERY_PIN_BYTES: ${QUERY_PIN_BYTES:-0}
      ARTEMIS_DB_USER: analysis
      ARTEMIS_DB_PASSWORD: ${ANALYSIS_PWD}
      TELEMETRY_DB_USER: analysis
      TELEMETRY_DB_PASSWORD: ${ANALYSIS_PWD}
    volumes:
      - query_cache:/cache
    networks:
      - telemetry_network
    ports:
      - "127.0.0.1:8090:8090"

  mosquitto:
    image: ${TELEMETRY_MQTT_IMAGE:-lhre/telemetry-mqtt:2.0.18}
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - telemetry_network
    ports:
      - "1883:1883"
      - "9001:9001"
      - "8080:8080"

  ingest:
    image: ${TELEMETRY_INGEST_IMAGE:-lhre/telemetry-ingest:dev}
    container_name: ingest
    restart: unless-stopped
    depends_on:
      - mosquitto
    env_file:
      - path: ../../../../.env
        required: true
    environment:
      PYTHONUNBUFFERED: 1   # Allows output in Docker Compose console
      IN_DOCKER: 1          # Custom env variable used for IP resolution
      SERVER_TARGET: 'LOCAL'
      LOGLEVEL: 'DEBUG'
    volumes:
      - ../../net_configs.json:/app/net_configs.json
    networks:
      - telemetry_network

  db_writer:
    image: ${TELEMETRY_DB_WRITER_IMAGE:-lhre/telemetry-db-writer:dev}
    container_name: db-writer
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - path: ../../../../.env
        required: true
    environment:
      IN_DOCKER: 1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: telemetry-db-writer-v1
      DB_BATCH_PACKETS: ${DB_BATCH_PACKETS:-500}
      DB_BATCH_SECONDS: ${DB_BATCH_SECONDS:-0.25}
    networks:
      - telemetry_network

  db:
    image: ${TELEMETRY_POSTGRES_IMAGE:-lhre/telemetry-postgres:2.31.0-pg17}
    container_name: db
    restart: unless-stopped
    shm_size: 2gb
    env_file:
      - path: ../../../../.env
        required: true
    volumes:
      - telemetry_db:/var/lib/postgresql/data
      - ./common_schema.sql:/app/common_schema.sql:ro
      - type: bind
        source: ${ARTEMIS_DB_INIT_SQL:?Build //apps/telemetry:new_car_schema_sql and set its absolute output path}
        target: /app/artemis_db_init.sql
        read_only: true
        bind:
          create_host_path: false
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - telemetry_network
    ports:
      - "5432:5432"
    tmpfs:
      - /tmp
      - /run/postgresql

  grafana:
    image: ${TELEMETRY_GRAFANA_IMAGE:-lhre/telemetry-grafana:11.3.0}
    container_name: grafana
    restart: unless-stopped
    env_file:
      - path: ../../../../.env
        required: true
    environment:
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: '250ms'     # Sets min refresh rate of grafana dashboard
      GF_SERVER_ROOT_URL: 'https://telemetry.lhre.org/grafana/'  # Adjust if using a different host or port
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SERVER_PROTOCOL: 'http'
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: 'lhre-kafka-datasource,lhre-artemis-datasource'
      GF_PATHS_PLUGINS: /usr/share/grafana/lhre-plugins
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning/datasources:ro
      - ./grafana-dashboard-provisioning:/etc/grafana/provisioning/dashboards:ro
      - ../../analysis/database/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana-kafka-datasource/dist:/usr/share/grafana/lhre-plugins/lhre-kafka-datasource:ro
    networks:
      - telemetry_network
    ports:
      - "3000:3000"

volumes:
  query_cache:
  grafana_storage:
    external: true
  telemetry_db:
    external: true
  # named volume used when bind-mount is not desired
  logs:
    driver: local

networks:
  telemetry_network:
    external: true
