services:
  db_processor:
    image: ${TELEMETRY_LAP_TIMER_IMAGE:-lhre/telemetry-lap-timer:dev}
    container_name: lap_timer_processor
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        required: true
    environment:
      PYTHONUNBUFFERED: 1
      IN_DOCKER: 1
      LOCALHOST_IP: 'host.docker.internal'
    volumes:
      - ../../../net_configs.json:/app/net_configs.json
    networks:
      - telemetry_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  telemetry_network:
    external: true
