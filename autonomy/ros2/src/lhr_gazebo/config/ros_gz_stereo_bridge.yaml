# Opt-in camera streams; preserve renderer timestamps and optical frames.
- gz_topic_name: /zed2i/left/image_rect
  ros_topic_name: /lhr/sensor/zed2i/left/image_rect
  gz_type_name: gz.msgs.Image
  ros_type_name: sensor_msgs/msg/Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
- gz_topic_name: /zed2i/left/camera_info
  ros_topic_name: /lhr/sensor/zed2i/left/camera_info
  gz_type_name: gz.msgs.CameraInfo
  ros_type_name: sensor_msgs/msg/CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
- gz_topic_name: /zed2i/right/image_rect
  ros_topic_name: /lhr/sensor/zed2i/right/image_rect
  gz_type_name: gz.msgs.Image
  ros_type_name: sensor_msgs/msg/Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
- gz_topic_name: /zed2i/right/camera_info
  ros_topic_name: /lhr/sensor/zed2i/right/camera_info
  gz_type_name: gz.msgs.CameraInfo
  ros_type_name: sensor_msgs/msg/CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
