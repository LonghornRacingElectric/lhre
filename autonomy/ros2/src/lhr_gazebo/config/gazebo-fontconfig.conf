<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Do not include fonts.conf: it brings user fonts and matching rules
       back into Gazebo, defeating isolation from Qt font-fallback crashes. -->
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
