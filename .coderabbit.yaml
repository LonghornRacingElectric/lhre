# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit settings for this repo. Anything not set here falls back to the
# org dashboard. CodeRabbit reads this file from each PR's own branch.
reviews:
  # The autonomy team opts out of CodeRabbit. Its PR titles start with
  # "Autonomous:", which skips the review, and autonomy/ files are left out
  # of every other team's reviews too.
  path_filters:
    - "!autonomy/**"
  auto_review:
    ignore_title_keywords:
      - "Autonomous:"
