# Pre-build hook generates the CAN message matrix and signal directory
hooks:
  - tools/spec/doc_hook.py

# Docs live next to the code: any *.md in the tree becomes a page at the
# same path (README.md renders as the directory index). The simple plugin
# also extracts fenced doc-comment blocks from source files — see
# https://athackst.github.io/mkdocs-simple-plugin/ ("semiliterate").
plugins:
  - search
  - simple:
      # Collect pages out of the way of the working tree (hidden paths are
      # never scanned, so the build can't pick up its own output).
      build_dir: .mkdocs-build
      # Keep docs/ pages at docs/ on the site instead of hoisting them to
      # the root, so relative links in and to docs/*.md resolve the same on
      # GitHub and on the published site.
      merge_docs_dir: false
      folders:
        - apps
        - boards
        - docs
        - drivers
        - lib
        - platforms
        - toolchains
        - tools
        - "*.md"
      # Overriding `ignore` replaces the plugin defaults, so the defaults
      # (first five entries) are repeated here before our additions.
      ignore:
        - "*.egg-info"
        - "**/__pycache__/**"
        - "vendor/**"
        - "venv/**"
        - ".**/**"
        - "bazel-*/**" # convenience symlinks into the output base
        - "site/**" # mkdocs build output
        - "external/**" # third-party staging
        - "patches/**"

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/car-electric
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.snippets

extra_css:
  - docs/stylesheets/extra.css
