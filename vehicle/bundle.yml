torque_topology:
  drive:
    front_share:
      value: 0.0
      status: declared
      source: Arjun Rao, 2026-10-20. One inboard motor drives the rear axle through a differential.
    rear_share:
      value: 1.0
      status: declared
      source: Arjun Rao, 2026-10-20. One inboard motor drives the rear axle through a differential.
    reaction:
      value: chassis
      status: declared
      source: Arjun Rao, 2026-10-20. The motor and the differential are inboard, on the chassis.
  hydraulic_brake:
    front:
      reaction:
        value: upright
        status: declared
        source: Will Schmitt, 2026-09-24 (LHRe agent search, 2026-10-20). Front calipers are outboard on the upright.
    rear:
      reaction:
        value: chassis
        status: declared
        source: Ella, 2026-10-13 (LHRe agent search, 2026-10-20). The rear caliper is inboard, beside the differential.
