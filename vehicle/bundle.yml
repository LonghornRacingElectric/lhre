      value: 0.0
      status: assumed
      source: >-
        Regen uses the one motor and the same driveline as drive. BobSim fe03bab maps that
        driveline to the rear axle (app/modelica_generator.py line 249). No LHRe record states
        the regen axle.
    rear_share:
      value: 1.0
      status: assumed
      source: >-
        Regen uses the one motor and the same driveline as drive. BobSim fe03bab maps that
        driveline to the rear axle (app/modelica_generator.py line 249). No LHRe record states
        the regen axle.
