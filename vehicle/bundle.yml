setup:
  id:
    value: null
    status: unavailable
    source: No setup sheet or setup name exists for this car.
  source:
    value: bobsim-999dc84-vehicle
    status: assumed
    source: >-
      Toe, camber, spring tables, free lengths, bar rates, brake bias and dampers equal BobSim
      999dc84 vehicle.yml (diff on 2026-11-28). The dampers are its TTX25 C12/R12 setting on both
      axles: 6 compression and 10 rebound low-speed clicks from closed, 4.3 high-speed turns from
      open. The Orion pre-event checklist lists other clicks per corner, but BobSim's TTX25 dataset
      has no measured curve for them, so BobSim rejects them. No signed LHRe setup sheet states any
      of these.
torque_topology:
  drive:
    front_share:
      value: 0.0
      status: declared
      source: Arjun Rao, 2026-10-20. One inboard motor drives the rear axle through a differential.
    rear_share:
      value: 1.0
      status: declared
      source: Arjun Rao, 2026-10-20. One inboard motor drives the rear axle through a differential.
    reaction:
      value: chassis
      status: declared
      source: Arjun Rao, 2026-10-20. The motor and the differential are inboard, on the chassis.
  hydraulic_brake:
    front:
      reaction:
        value: upright
        status: declared
        source: Will Schmitt, 2026-09-24 (LHRe agent search, 2026-10-20). Front calipers are outboard on the upright.
    rear:
      reaction:
        value: chassis
        status: declared
        source: Ella, 2026-10-13 (LHRe agent search, 2026-10-20). The rear caliper is inboard, beside the differential.
  regen:
    front_share:
      value: 0.0
      status: assumed
      source: >-
        Regen uses the one motor and the same driveline as drive. BobSim fe03bab maps that
        driveline to the rear axle (app/modelica_generator.py line 249). No LHRe record states
        the regen axle.
    rear_share:
      value: 1.0
      status: assumed
      source: >-
        Regen uses the one motor and the same driveline as drive. BobSim fe03bab maps that
        driveline to the rear axle (app/modelica_generator.py line 249). No LHRe record states
        the regen axle.
    reaction:
      value: null
      status: unavailable
      source: No LHRe record states where the regen torque reacts.
