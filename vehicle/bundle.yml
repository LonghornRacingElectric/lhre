    value: {x: forward, y: left, z: up}
    status: declared
    source: >-
      BobSim fe03bab docs/conventions.md lines 9 to 11 state the boblib.vehicle.v1 frame. That page
      says it was derived from the BobSim code.
  units:
    value: {length: m, mass: kg, alignment_angle: deg}
    status: declared
    source: BobSim fe03bab docs/conventions.md lines 9 to 12 and the key suffixes in vehicle.yml.
  datum_z:
    front:
      value: null
      status: unavailable
      source: >-
        BobSim fe03bab docs/conventions.md line 50 says the vertical datum is unresolved. No LHRe
        record gives the z datum of the front points.
    rear:
      value: null
      status: unavailable
      source: >-
        BobSim fe03bab docs/conventions.md line 50 says the vertical datum is unresolved. No LHRe
        record gives the z datum of the rear points.
  mirror:
    stored_side:
      value: left
      status: declared
      source: BobSim fe03bab docs/conventions.md line 10. Only the left side is stored.
    rule:
      value: negate_y
      status: declared
      source: BobSim fe03bab docs/conventions.md line 25. The opposite corner negates y.
