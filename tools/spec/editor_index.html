<!DOCTYPE html>
<!-- CAN spec editor frontend. Served by editor.py; talks to /api/*.
     Editing logic lives here. The backend loads, validates with the real
     //lib/spec validator, derives proto types, and writes canonical files. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CAN spec editor</title>
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --panel2: #262a33; --line: #363c49;
    --text: #d7dae2; --dim: #8b93a5; --accent: #e8722c; --ok: #4caf7d;
    --warn: #d8b13c; --err: #e05252;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; color: var(--accent); }
  header .spacer { flex: 1; }
  .chip { padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .chip.ok { background: #1d3a2c; color: var(--ok); }
  .chip.err { background: #40201f; color: var(--err); }
  .chip.warn { background: #3c3418; color: var(--warn); }
  .chip.busy { background: #2a2f3a; color: var(--dim); }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
           border-radius: 5px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #16181d; font-weight: 600; }
  button.danger { color: var(--err); }
  button.small { padding: 2px 8px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: default; }
  #layout { display: grid; grid-template-columns: 230px 1fr 300px;
            height: calc(100vh - 42px); }
  #nav, #issues { overflow-y: auto; background: var(--panel); }
  #nav { border-right: 1px solid var(--line); }
  #issues { border-left: 1px solid var(--line); padding: 10px; }
  #main { overflow-y: auto; padding: 14px 18px; }
  #tabs { display: flex; border-bottom: 1px solid var(--line);
          position: sticky; top: 0; background: var(--panel); }
  #tabs button { flex: 1; border: none; border-radius: 0; padding: 8px 0;
                 color: var(--dim); background: none; }
  #tabs button.on { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #navlist { padding: 8px; }
  .navgroup { color: var(--dim); font-size: 11px; margin: 10px 0 3px; }
  .navitem { padding: 4px 8px; border-radius: 4px; cursor: pointer;
             display: flex; gap: 8px; align-items: baseline; }
  .navitem:hover { background: var(--panel2); }
  .navitem.sel { background: var(--panel2); outline: 1px solid var(--accent); }
  .navitem .id { color: var(--dim); font-family: ui-monospace, monospace; font-size: 12px; }
  h2 { font-size: 14px; margin: 16px 0 8px; color: var(--accent); }
  h2:first-child { margin-top: 0; }
  h2 .sub { color: var(--dim); font-weight: 400; font-size: 12px; }
  label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  input, select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 7px; font-size: 13px; width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 80px; }
  .row > div.wide { flex: 3; min-width: 200px; }
  table.grid2 { border-collapse: collapse; width: 100%; }
  table.grid2 th { text-align: left; color: var(--dim); font-weight: 500; font-size: 11px;
                   border-bottom: 1px solid var(--line); padding: 4px 8px; }
  table.grid2 td { padding: 3px 8px; border-bottom: 1px solid #262a33; }
  table.grid2 tr.clickable td { cursor: pointer; }
  table.grid2 tr.sel > td { background: var(--panel2); }
  table.grid2 td.edit { padding: 0; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
            margin-right: 6px; vertical-align: middle; }
  #frame { border-collapse: collapse; font-family: ui-monospace, monospace;
           font-size: 11px; margin: 6px 0 2px; }
  #frame td, #frame th { border: 1px solid var(--line); width: 32px; height: 22px;
                         text-align: center; padding: 0; }
  #frame th { color: var(--dim); font-weight: 400; background: var(--panel); }
  #frame td.conflict { background: repeating-linear-gradient(45deg, #6d2020, #6d2020 4px,
                       #402020 4px, #402020 8px) !important; }
  #frame td.hl { outline: 2px solid #fff; outline-offset: -2px; }
  .editbox { background: var(--panel); border-left: 2px solid var(--accent);
             padding: 10px 12px; }
  .preview { font-family: ui-monospace, monospace; font-size: 12px; margin: 2px 0; }
  .preview .val { color: var(--warn); }
  .ptype { font-family: ui-monospace, monospace; color: var(--ok); }
  .issue { padding: 5px 8px; border-radius: 4px; margin-bottom: 5px; font-size: 12px;
           font-family: ui-monospace, monospace; white-space: pre-wrap;
           word-break: break-word; }
  .issue.err { background: #33201f; color: #eba1a1; }
  .issue.warn { background: #322c15; color: #e5cd7e; }
  .muted { color: var(--dim); }
  .checkline { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  .checkline input { width: auto; }
  .checkline label { margin: 0; font-size: 13px; color: var(--text); }
  .hint { font-size: 12px; color: var(--dim); margin: 4px 0 10px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 8px; min-width: 380px; }
  dialog::backdrop { background: #000a; }
</style>
</head>
<body>
<header>
  <h1>CAN spec editor</h1>
  <span id="status" class="chip busy">loading</span>
  <span class="spacer"></span>
  <span id="dirty" class="muted"></span>
  <button id="reload">Reload</button>
  <button id="save" class="primary">Save</button>
</header>
<div id="layout">
  <div id="nav">
    <div id="tabs">
      <button data-mode="messages" class="on">Messages</button>
      <button data-mode="types">Types</button>
      <button data-mode="groups">Groups</button>
    </div>
    <div id="navlist"></div>
  </div>
  <div id="main"></div>
  <div id="issues"></div>
</div>

<dialog id="newDialog">
  <h2 style="margin-top:0" id="nd_title">New</h2>
  <div id="nd_body"></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px">
    <button id="nd_cancel">Cancel</button>
    <button id="nd_ok" class="primary">Create</button>
  </div>
</dialog>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PALETTE = ["#4e79a7","#f28e2b","#59a14f","#e15759","#b07aa1",
                 "#76b7b2","#edc948","#ff9da7","#9c755f","#bab0ac"];
const TIERS = ["TIER_UNSPECIFIED","FAST","MEDIUM","SLOW"];
const TYPES_FILE = "lib/spec/types.textproto";

let spec = null;        // {files, digest}
let mode = "messages";
let sel = null;         // selection within the current mode
let selSig = -1;        // expanded signal row
let derivedTypes = {};  // "MSG.signal" -> proto type, from the server
let validateTimer = null;

// ---- model helpers ---------------------------------------------------------

const files = () => spec.files;

function allOf(field) {
  const out = [];
  for (const [file, f] of Object.entries(files()))
    for (const item of (f[field] || [])) out.push({file, item});
  return out;
}
function messageFiles() {
  return Object.keys(files()).filter(p => p.includes("/messages/")).sort();
}
function groupsEntry() {
  for (const f of Object.values(files()))
    if (f.groups && f.groups.group) return f.groups;
  return null;
}
function ensureFile(path) {
  if (!files()[path]) files()[path] = {};
  return files()[path];
}
function selMsg() {
  if (mode !== "messages" || !sel) return null;
  return (files()[sel.file]?.message || [])[sel.mi] || null;
}
function selType() {
  if (mode !== "types" || !sel) return null;
  const key = sel.kind === "enum" ? "enum_type" : "bitfield_type";
  return (files()[sel.file]?.[key] || [])[sel.idx] || null;
}
function markDirty() {
  spec.dirty = true;
  $("#dirty").textContent = "unsaved changes";
  scheduleValidate();
}

// Bit occupancy, mirroring lib/spec/ir/validator.py occupied_bits().
function occupiedBits(enc) {
  const start = enc.start_bit ?? 0, len = enc.bit_length ?? 0;
  const bits = [];
  if ((enc.byte_order || "LITTLE_ENDIAN") === "LITTLE_ENDIAN") {
    for (let i = 0; i < len; i++) bits.push(start + i);
  } else {
    let byte = Math.floor(start / 8), bit = start % 8;
    for (let i = 0; i < len; i++) {
      bits.push(byte * 8 + bit);
      if (bit === 0) { byte++; bit = 7; } else bit--;
    }
  }
  return bits;
}
function logicalKind(sig) {
  const l = sig.logical || {};
  if ("enum_type" in l) return "enum_type";
  if ("boolean" in l) return "boolean";
  if (l.bitfield) return "bitfield";
  return "physical";
}
function rawRange(enc) {
  const n = enc.bit_length ?? 0;
  if (enc.sign === "SIGNED") return [-(2 ** (n - 1)), 2 ** (n - 1) - 1];
  return [0, 2 ** n - 1];
}
function physPreview(enc) {
  const [lo, hi] = rawRange(enc);
  const scale = enc.scale || 1, off = enc.offset || 0;
  const nice = (x) => Number(x.toPrecision(10));
  const a = nice(lo * scale + off), b = nice(hi * scale + off);
  return `[${Math.min(a, b)}, ${Math.max(a, b)}] step ${scale}`;
}

// ---- ledger ----------------------------------------------------------------

function findGroup(name) {
  return (groupsEntry()?.group || []).find(x => x.name === name) || null;
}
function allocId(groupName) {
  const g = findGroup(groupName);
  if (!g) return 1;
  const id = g.next_free_id || 1;
  g.next_free_id = id + 1;
  return id;
}
// Newest unsaved id shrinks the high-water mark back. Anything else is
// tombstoned, since ids are append-only.
function releaseBinding(tel) {
  const g = findGroup(tel.group);
  if (!g || !tel.id) return;
  g.reserved_ids = g.reserved_ids || [];
  g.reserved_names = g.reserved_names || [];
  if (tel.id === (g.next_free_id || 1) - 1 && !g.reserved_ids.includes(tel.id)) {
    g.next_free_id -= 1;
  } else {
    if (!g.reserved_ids.includes(tel.id)) g.reserved_ids.push(tel.id);
    if (tel.field && !g.reserved_names.includes(tel.field)) g.reserved_names.push(tel.field);
    g.reserved_ids.sort((a, b) => a - b);
    g.reserved_names.sort();
  }
}
function bitfieldByName(name) {
  return allOf("bitfield_type").find(b => b.item.name === name)?.item || null;
}
function releaseSignalBindings(msg, sig) {
  if (sig.telemetry?.group) releaseBinding(sig.telemetry);
  if (logicalKind(sig) === "bitfield") {
    const typeName = sig.logical.bitfield.bitfield_type;
    const stillUsed = allOf("message").some(({item}) =>
      (item.signal || []).some(s => s !== sig &&
        s.logical?.bitfield?.bitfield_type === typeName));
    if (!stillUsed) {
      for (const bit of (bitfieldByName(typeName)?.bit || []))
        if (bit.telemetry?.group) releaseBinding(bit.telemetry);
    }
  }
}

// ---- nav -------------------------------------------------------------------

function renderNav() {
  const list = $("#navlist");
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));
  if (mode === "messages") list.innerHTML = navMessages();
  else if (mode === "types") list.innerHTML = navTypes();
  else list.innerHTML = navGroups();
  list.querySelectorAll("[data-nav]").forEach(el =>
    el.onclick = () => { sel = JSON.parse(el.dataset.nav); selSig = -1; render(); });
  const add = $("#navAdd");
  if (add) add.onclick = openNewDialog;
}

function navMessages() {
  let html = `<button id="navAdd" style="width:100%">+ message</button>`;
  for (const file of Object.keys(files()).sort()) {
    const msgs = files()[file].message || [];
    if (!msgs.length) continue;
    html += `<div class="navgroup">${esc(file.replace("lib/spec/messages/", "")
      .replace(".textproto", ""))}</div>`;
    msgs.forEach((m, mi) => {
      const on = sel && sel.file === file && sel.mi === mi;
      html += `<div class="navitem ${on ? "sel" : ""}"
        data-nav='${JSON.stringify({file, mi})}'>
        <span class="id">0x${(m.can_id ?? 0).toString(16).toUpperCase().padStart(3, "0")}</span>
        <span>${esc(m.name)}</span></div>`;
    });
  }
  return html;
}

function navTypes() {
  let html = `<button id="navAdd" style="width:100%">+ enum or bitfield</button>`;
  html += `<div class="navgroup">enums</div>`;
  for (const {file, item} of allOf("enum_type")) {
    const idx = files()[file].enum_type.indexOf(item);
    const on = sel && sel.kind === "enum" && sel.file === file && sel.idx === idx;
    html += `<div class="navitem ${on ? "sel" : ""}"
      data-nav='${JSON.stringify({kind: "enum", file, idx})}'>
      <span>${esc(item.name)}</span>
      <span class="id">${(item.value || []).length}</span></div>`;
  }
  html += `<div class="navgroup">bitfields</div>`;
  for (const {file, item} of allOf("bitfield_type")) {
    const idx = files()[file].bitfield_type.indexOf(item);
    const on = sel && sel.kind === "bitfield" && sel.file === file && sel.idx === idx;
    html += `<div class="navitem ${on ? "sel" : ""}"
      data-nav='${JSON.stringify({kind: "bitfield", file, idx})}'>
      <span>${esc(item.name)}</span>
      <span class="id">${(item.bit || []).length}b</span></div>`;
  }
  return html;
}

function navGroups() {
  let html = `<button id="navAdd" style="width:100%">+ group</button>`;
  (groupsEntry()?.group || []).forEach((g, idx) => {
    const on = sel && sel.idx === idx;
    html += `<div class="navitem ${on ? "sel" : ""}" data-nav='${JSON.stringify({idx})}'>
      <span>${esc(g.name)}</span>
      <span class="id">next ${g.next_free_id ?? 1}</span></div>`;
  });
  return html;
}

// ---- main ------------------------------------------------------------------

function render() {
  renderNav();
  const main = $("#main");
  if (mode === "messages") renderMessage(main);
  else if (mode === "types") renderType(main);
  else renderGroups(main);
}

function renderMessage(main) {
  const msg = selMsg();
  if (!msg) {
    main.innerHTML = `<p class="muted">Pick a message, or add one.</p>`;
    return;
  }
  const buses = allOf("bus").map(b => b.item.name);
  main.innerHTML = `
    <h2>${esc(msg.name)} <span class="sub">${esc(sel.file.replace("lib/spec/", ""))}</span></h2>
    <div class="row">
      <div class="wide"><label>Name</label><input data-f="name" value="${esc(msg.name)}"></div>
      <div><label>CAN ID</label><input data-f="can_id" value="0x${(msg.can_id ?? 0).toString(16).toUpperCase()}"></div>
      <div><label>Quantity</label><input data-f="quantity" type="number" min="1" value="${msg.quantity || 1}"></div>
      <div><label>DLC</label><input data-f="dlc" type="number" min="0" max="8" value="${msg.dlc ?? 8}"></div>
      <div><label>Hz</label><input data-f="frequency_hz" type="number" step="any" value="${msg.frequency_hz ?? 0}"></div>
    </div>
    <div class="row">
      <div><label>Bus</label><select data-f="bus">${buses.map(b =>
        `<option ${b === msg.bus ? "selected" : ""}>${esc(b)}</option>`).join("")}</select></div>
      <div><label>From board</label><input data-f="from_board" value="${esc(msg.from_board)}"></div>
      <div><label>To boards</label><input data-f="to_boards" value="${esc((msg.to_boards || []).join(","))}"></div>
      <div><label>Default tier</label><select data-f="default_rate_tier">${TIERS.map(t =>
        `<option ${t === (msg.default_rate_tier || "TIER_UNSPECIFIED") ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="wide"><label>Description</label><input data-f="description" value="${esc(msg.description)}"></div>
    </div>
    <h2>Frame</h2>
    ${renderFrame(msg)}
    <p class="hint">Striped red means two signals claim the same bit. Signals on
      different mux values may share bits.</p>
    <h2>Signals</h2>
    ${renderSignals(msg)}
    <div class="row" style="margin-top:8px">
      <div><button id="addSig">+ signal</button></div>
      <div style="text-align:right"><button id="delMsg" class="danger small">Delete message</button></div>
    </div>`;
  bindMessage(msg);
}

function renderFrame(msg) {
  const dlc = msg.dlc ?? 8;
  const cells = {};
  (msg.signal || []).forEach((sig, si) => {
    if (!sig.encoding) return;
    for (const b of occupiedBits(sig.encoding)) (cells[b] = cells[b] || []).push(si);
  });
  let html = `<table id="frame"><tr><th></th>`;
  for (let b = 7; b >= 0; b--) html += `<th>${b}</th>`;
  html += `</tr>`;
  for (let byte = 0; byte < dlc; byte++) {
    html += `<tr><th>B${byte}</th>`;
    for (let bit = 7; bit >= 0; bit--) {
      const owners = cells[byte * 8 + bit] || [];
      let cls = "", style = "";
      const title = owners.map(si => msg.signal[si].name).join(" + ");
      if (owners.length === 1) {
        style = `background:${PALETTE[owners[0] % PALETTE.length]}44;`;
        if (owners[0] === selSig) cls = "hl";
      } else if (owners.length > 1) {
        const clash = owners.some((a, i) => owners.slice(i + 1).some(b => {
          const ea = msg.signal[a].encoding, eb = msg.signal[b].encoding;
          return !(ea.muxed && eb.muxed && (ea.mux_value ?? 0) !== (eb.mux_value ?? 0));
        }));
        cls = clash ? "conflict" : "";
        if (!clash) style = `background:${PALETTE[owners[0] % PALETTE.length]}33;`;
        if (owners.includes(selSig)) cls += " hl";
      }
      html += `<td class="${cls}" style="${style}" title="${esc(title)}"></td>`;
    }
    html += `</tr>`;
  }
  return html + `</table>`;
}

function renderSignals(msg) {
  let rows = "";
  (msg.signal || []).forEach((sig, si) => {
    const enc = sig.encoding || {}, kind = logicalKind(sig);
    const tel = sig.telemetry?.group
      ? `${esc(sig.telemetry.group)}.${esc(sig.telemetry.field)} #${sig.telemetry.id}` : "";
    const kindTxt = kind === "physical"
      ? (sig.logical?.physical?.unit ? esc(sig.logical.physical.unit) : "number")
      : kind === "enum_type" ? esc(sig.logical.enum_type)
      : kind === "boolean" ? "bool" : esc(sig.logical.bitfield.bitfield_type);
    const mux = sig.logical?.mux_selector ? " (selector)"
      : enc.muxed ? ` (mux ${enc.mux_value ?? 0})` : "";
    rows += `<tr class="clickable ${si === selSig ? "sel" : ""}" data-si="${si}">
      <td><span class="swatch" style="background:${PALETTE[si % PALETTE.length]}"></span>${esc(sig.name)}${mux}</td>
      <td>${enc.start_bit ?? 0}+${enc.bit_length ?? 0}${enc.byte_order === "BIG_ENDIAN" ? " BE" : ""}${enc.sign === "SIGNED" ? " signed" : ""}</td>
      <td>${kindTxt}</td>
      <td class="ptype">${esc(derivedTypes[`${msg.name}.${sig.name}`] || "")}</td>
      <td>${tel}</td></tr>`;
    if (si === selSig)
      rows += `<tr><td class="edit" colspan="5">${signalForm(msg, sig)}</td></tr>`;
  });
  return `<table class="grid2"><tr><th>signal</th><th>bits</th><th>kind</th>
    <th title="Snapshot proto type, derived from the encoding">proto</th>
    <th>telemetry</th></tr>${rows}</table>`;
}

function signalForm(msg, sig) {
  const enc = sig.encoding || (sig.encoding = {});
  const kind = logicalKind(sig);
  const enums = allOf("enum_type").map(e => e.item.name);
  const bitfields = allOf("bitfield_type").map(b => b.item.name);
  const groups = (groupsEntry()?.group || []).map(g => g.name);
  const tel = sig.telemetry || {};
  const hasTel = !!tel.group;
  return `<div class="editbox">
    <div class="row">
      <div class="wide"><label>Name</label><input data-s="name" value="${esc(sig.name)}"></div>
      <div class="wide"><label>Description</label><input data-s="description" value="${esc(sig.description)}"></div>
    </div>
    <div class="row">
      <div><label>Start bit</label><input data-s="enc.start_bit" type="number" min="0" value="${enc.start_bit ?? 0}"></div>
      <div><label>Length</label><input data-s="enc.bit_length" type="number" min="1" value="${enc.bit_length ?? 1}"></div>
      <div><label>Byte order</label><select data-s="enc.byte_order">
        <option ${enc.byte_order !== "BIG_ENDIAN" ? "selected" : ""}>LITTLE_ENDIAN</option>
        <option ${enc.byte_order === "BIG_ENDIAN" ? "selected" : ""}>BIG_ENDIAN</option></select></div>
      <div><label>Sign</label><select data-s="enc.sign">
        <option ${enc.sign !== "SIGNED" ? "selected" : ""}>UNSIGNED</option>
        <option ${enc.sign === "SIGNED" ? "selected" : ""}>SIGNED</option></select></div>
      <div><label>Scale</label><input data-s="enc.scale" type="number" step="any" value="${enc.scale ?? 0}"></div>
      <div><label>Offset</label><input data-s="enc.offset" type="number" step="any" value="${enc.offset ?? 0}"></div>
    </div>
    <div class="preview">range <span class="val" id="physPreview">${physPreview(enc)}</span>
      ${sig.logical?.physical?.unit ? esc(sig.logical.physical.unit) : ""}
      &nbsp;&nbsp;proto type <span class="ptype" id="ptypeVal">${esc(derivedTypes[`${msg.name}.${sig.name}`] || "")}</span></div>
    <div class="row" style="margin-top:8px">
      <div><label>Kind</label><select id="kind">
        ${["physical","enum_type","boolean","bitfield"].map(k =>
          `<option value="${k}" ${k === kind ? "selected" : ""}>${k}</option>`).join("")}</select></div>
      <div>${
        kind === "physical" ? `<label>Unit</label><input data-s="unit" value="${esc(sig.logical?.physical?.unit)}">`
        : kind === "enum_type" ? `<label>Enum</label><select data-s="enumref">${enums.map(e =>
            `<option ${e === sig.logical.enum_type ? "selected" : ""}>${esc(e)}</option>`).join("")}</select>`
        : kind === "bitfield" ? `<label>Bitfield</label><select data-s="bitfieldref">${bitfields.map(b =>
            `<option ${b === sig.logical.bitfield.bitfield_type ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>`
        : `<label>&nbsp;</label><span class="muted">length must be 1</span>`}</div>
      <div><label>Min</label><input data-s="enc.min" type="number" step="any" value="${enc.min ?? 0}"></div>
      <div><label>Max</label><input data-s="enc.max" type="number" step="any" value="${enc.max ?? 0}"></div>
    </div>
    <div class="checkline">
      <input type="checkbox" id="muxed" ${enc.muxed ? "checked" : ""}>
      <label for="muxed">only present when selector =</label>
      <input data-s="enc.mux_value" type="number" min="0" style="width:70px"
             value="${enc.mux_value ?? 0}" ${enc.muxed ? "" : "disabled"}>
      <span style="width:20px"></span>
      <input type="checkbox" id="muxsel" ${sig.logical?.mux_selector ? "checked" : ""}>
      <label for="muxsel">is the selector</label>
    </div>
    ${kind === "bitfield"
      ? `<p class="hint">Bits bind telemetry on the bitfield type, under Types.</p>`
      : `<div class="checkline"><input type="checkbox" id="telOn" ${hasTel ? "checked" : ""}>
           <label for="telOn">send to the server</label></div>
         ${hasTel ? `<div class="row">
           <div><label>Group</label><select data-s="tel.group">${groups.map(g =>
             `<option ${g === tel.group ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></div>
           <div><label>Field</label><input data-s="tel.field" value="${esc(tel.field)}"></div>
           <div><label>Proto id</label><input value="${tel.id ?? ""}" disabled></div>
           <div><label>Tier</label><select data-s="tel.rate_tier">${TIERS.map(t =>
             `<option ${t === (tel.rate_tier || "TIER_UNSPECIFIED") ? "selected" : ""}>${t === "TIER_UNSPECIFIED" ? "inherit" : t}</option>`).join("")}</select></div>
         </div>` : ""}`}
    <div style="text-align:right"><button id="delSig" class="danger small">Delete signal</button></div>
  </div>`;
}

function renderType(main) {
  const t = selType();
  if (!t) {
    main.innerHTML = `<p class="muted">Pick an enum or bitfield, or add one.</p>`;
    return;
  }
  main.innerHTML = sel.kind === "enum" ? enumForm(t) : bitfieldForm(t);
  bindType(t);
}

function enumForm(t) {
  const rows = (t.value || []).map((v, i) => `<tr>
    <td><input data-v="${i}.name" value="${esc(v.name)}"></td>
    <td style="width:90px"><input data-v="${i}.number" type="number" min="0" value="${v.number ?? 0}"></td>
    <td><input data-v="${i}.description" value="${esc(v.description)}"></td>
    <td style="width:30px"><button class="danger small" data-delv="${i}">x</button></td></tr>`).join("");
  return `<h2>${esc(t.name)} <span class="sub">enum</span></h2>
    <div class="row">
      <div><label>Name</label><input data-t="name" value="${esc(t.name)}"></div>
      <div class="wide"><label>Description</label><input data-t="description" value="${esc(t.description)}"></div>
    </div>
    <p class="hint">Values are raw wire numbers. Signals using this enum must be
      wide enough to hold the largest.</p>
    <table class="grid2"><tr><th>name</th><th>value</th><th>description</th><th></th></tr>${rows}</table>
    <div class="row" style="margin-top:8px">
      <div><button id="addVal">+ value</button></div>
      <div style="text-align:right"><button id="delType" class="danger small">Delete enum</button></div>
    </div>`;
}

function bitfieldForm(t) {
  const groups = (groupsEntry()?.group || []).map(g => g.name);
  const rows = (t.bit || []).map((b, i) => {
    const tel = b.telemetry || {};
    return `<tr>
      <td style="width:36px" class="muted">bit ${i}</td>
      <td><input data-b="${i}.name" value="${esc(b.name)}"></td>
      <td><input data-b="${i}.description" value="${esc(b.description)}"></td>
      <td style="width:210px">${tel.group
        ? `<select data-b="${i}.tel.group">${groups.map(g =>
             `<option ${g === tel.group ? "selected" : ""}>${esc(g)}</option>`).join("")}</select>
           <input data-b="${i}.tel.field" value="${esc(tel.field)}" placeholder="field">
           <span class="muted">#${tel.id}</span>`
        : `<button class="small" data-telon="${i}">+ telemetry</button>`}</td>
      <td style="width:52px">${tel.group ? `<button class="small" data-teloff="${i}">unbind</button>` : ""}</td>
      <td style="width:30px"><button class="danger small" data-delb="${i}">x</button></td></tr>`;
  }).join("");
  return `<h2>${esc(t.name)} <span class="sub">bitfield</span></h2>
    <div class="row">
      <div><label>Name</label><input data-t="name" value="${esc(t.name)}"></div>
      <div class="wide"><label>Description</label><input data-t="description" value="${esc(t.description)}"></div>
    </div>
    <p class="hint">Each bit becomes its own bool field on the server. Bit 0 is the
      signal's lowest bit.</p>
    <table class="grid2"><tr><th></th><th>name</th><th>description</th><th>telemetry</th><th></th><th></th></tr>${rows}</table>
    <div class="row" style="margin-top:8px">
      <div><button id="addBit">+ bit</button></div>
      <div style="text-align:right"><button id="delType" class="danger small">Delete bitfield</button></div>
    </div>`;
}

function renderGroups(main) {
  const reg = groupsEntry();
  if (!reg) { main.innerHTML = `<p class="muted">No group registry found.</p>`; return; }
  const g = sel ? reg.group[sel.idx] : null;
  if (!g) { main.innerHTML = `<p class="muted">Pick a group, or add one.</p>`; return; }
  const users = [];
  for (const {item: msg} of allOf("message"))
    for (const s of (msg.signal || []))
      if (s.telemetry?.group === g.name)
        users.push(`${msg.name}.${s.name} → ${s.telemetry.field} #${s.telemetry.id}`);
  for (const {item: bf} of allOf("bitfield_type"))
    for (const b of (bf.bit || []))
      if (b.telemetry?.group === g.name)
        users.push(`${bf.name}.${b.name} → ${b.telemetry.field} #${b.telemetry.id}`);
  main.innerHTML = `<h2>${esc(g.name)} <span class="sub">telemetry group</span></h2>
    <div class="row">
      <div><label>Name</label><input data-g="name" value="${esc(g.name)}"></div>
      <div class="wide"><label>Description</label><input data-g="description" value="${esc(g.description)}"></div>
    </div>
    <p class="hint">Ids are handed out automatically and never reused. Removed
      fields are tombstoned below.</p>
    <div class="row">
      <div><label>Next free id</label><input value="${g.next_free_id ?? 1}" disabled></div>
      <div class="wide"><label>Tombstoned ids</label><input value="${(g.reserved_ids || []).join(", ")}" disabled></div>
      <div class="wide"><label>Tombstoned names</label><input value="${(g.reserved_names || []).join(", ")}" disabled></div>
    </div>
    <h2>Fields</h2>
    <table class="grid2">${users.sort().map(u => `<tr><td>${esc(u)}</td></tr>`).join("")
      || `<tr><td class="muted">nothing bound yet</td></tr>`}</table>
    <div class="row" style="margin-top:8px"><div style="text-align:right">
      <button id="delGroup" class="danger small">Delete group</button></div></div>`;
  $("#main").querySelectorAll("[data-g]").forEach(el => el.onchange = () => {
    g[el.dataset.g] = el.value; markDirty(); render();
  });
  $("#delGroup").onclick = () => {
    if (users.length) return alert("Group still has fields bound to it.");
    if (!confirm(`Delete group ${g.name}?`)) return;
    reg.group.splice(sel.idx, 1); sel = null; markDirty(); render();
  };
}

// ---- binding ---------------------------------------------------------------

function bindMessage(msg) {
  $("#main").querySelectorAll("[data-f]").forEach(el => el.onchange = () => {
    const f = el.dataset.f;
    if (f === "can_id") msg.can_id = parseInt(el.value, 16) || 0;
    else if (f === "quantity" || f === "dlc" || f === "frequency_hz") msg[f] = +el.value || 0;
    else if (f === "to_boards") msg.to_boards = el.value.split(",").map(s => s.trim()).filter(Boolean);
    else msg[f] = el.value;
    markDirty(); render();
  });
  $("#delMsg").onclick = () => {
    if (!confirm(`Delete ${msg.name}? Its telemetry ids get tombstoned.`)) return;
    for (const sig of (msg.signal || [])) releaseSignalBindings(msg, sig);
    files()[sel.file].message.splice(sel.mi, 1);
    sel = null; selSig = -1; markDirty(); render();
  };
  $("#addSig").onclick = () => {
    msg.signal = msg.signal || [];
    const used = msg.signal.flatMap(s => s.encoding ? occupiedBits(s.encoding) : []);
    msg.signal.push({name: "new_signal",
      encoding: {start_bit: used.length ? Math.max(...used) + 1 : 0, bit_length: 8},
      logical: {physical: {unit: ""}}});
    selSig = msg.signal.length - 1; markDirty(); render();
  };
  $("#main").querySelectorAll("tr[data-si]").forEach(el => el.onclick = (ev) => {
    if (ev.target.closest(".editbox")) return;
    selSig = selSig === +el.dataset.si ? -1 : +el.dataset.si;
    render();
  });
  if (selSig >= 0) bindSignal(msg, msg.signal[selSig]);
}

function bindSignal(msg, sig) {
  const box = $("#main .editbox");
  box.querySelectorAll("[data-s]").forEach(el => {
    el.onchange = () => {
      const k = el.dataset.s;
      if (k.startsWith("enc.")) {
        const f = k.slice(4);
        sig.encoding[f] = (el.tagName === "SELECT") ? el.value : +el.value || 0;
      } else if (k === "unit") sig.logical.physical.unit = el.value;
      else if (k === "enumref") sig.logical = {enum_type: el.value, mux_selector: sig.logical.mux_selector};
      else if (k === "bitfieldref") sig.logical = {bitfield: {bitfield_type: el.value}};
      else if (k === "tel.group") {
        releaseBinding(sig.telemetry);
        sig.telemetry.group = el.value;
        sig.telemetry.id = allocId(el.value);
      } else if (k.startsWith("tel.")) sig.telemetry[k.slice(4)] = el.value;
      else sig[k] = el.value;
      markDirty(); render();
    };
    if (el.dataset.s.startsWith("enc.") && el.tagName === "INPUT")
      el.oninput = () => {
        const trial = {...sig.encoding, [el.dataset.s.slice(4)]: +el.value || 0};
        $("#physPreview").textContent = physPreview(trial);
      };
  });
  $("#kind").onchange = () => {
    const k = $("#kind").value;
    if (logicalKind(sig) === "bitfield" || k === "bitfield") releaseSignalBindings(msg, sig);
    const keepSel = sig.logical?.mux_selector || false;
    if (k === "physical") sig.logical = {physical: {unit: ""}, mux_selector: keepSel};
    else if (k === "enum_type") sig.logical = {enum_type: allOf("enum_type")[0]?.item.name || "", mux_selector: keepSel};
    else if (k === "boolean") { sig.logical = {boolean: false, mux_selector: false}; sig.encoding.bit_length = 1; }
    else { sig.logical = {bitfield: {bitfield_type: allOf("bitfield_type")[0]?.item.name || ""}};
           if (sig.telemetry?.group) { releaseBinding(sig.telemetry); delete sig.telemetry; } }
    markDirty(); render();
  };
  $("#muxed").onchange = () => { sig.encoding.muxed = $("#muxed").checked; markDirty(); render(); };
  $("#muxsel").onchange = () => { sig.logical.mux_selector = $("#muxsel").checked; markDirty(); render(); };
  $("#delSig").onclick = () => {
    releaseSignalBindings(msg, sig);
    msg.signal.splice(selSig, 1); selSig = -1; markDirty(); render();
  };
  const telOn = $("#telOn");
  if (telOn) telOn.onchange = () => {
    if (telOn.checked) {
      const group = (groupsEntry()?.group || [])[0]?.name || "";
      sig.telemetry = {group, field: sig.name, id: allocId(group)};
    } else { releaseBinding(sig.telemetry); delete sig.telemetry; }
    markDirty(); render();
  };
}

function bindType(t) {
  const main = $("#main");
  main.querySelectorAll("[data-t]").forEach(el => el.onchange = () => {
    t[el.dataset.t] = el.value; markDirty(); render();
  });
  $("#delType").onclick = () => {
    const users = allOf("message").flatMap(({item}) => (item.signal || []))
      .filter(s => s.logical?.enum_type === t.name ||
                   s.logical?.bitfield?.bitfield_type === t.name);
    if (users.length) return alert(`Still used by ${users.length} signal(s).`);
    if (!confirm(`Delete ${t.name}?`)) return;
    if (sel.kind === "bitfield")
      for (const b of (t.bit || [])) if (b.telemetry?.group) releaseBinding(b.telemetry);
    const key = sel.kind === "enum" ? "enum_type" : "bitfield_type";
    files()[sel.file][key].splice(sel.idx, 1);
    sel = null; markDirty(); render();
  };

  if (sel.kind === "enum") {
    main.querySelectorAll("[data-v]").forEach(el => el.onchange = () => {
      const [i, f] = el.dataset.v.split(".");
      t.value[+i][f] = f === "number" ? (+el.value || 0) : el.value;
      markDirty(); render();
    });
    main.querySelectorAll("[data-delv]").forEach(el => el.onclick = () => {
      t.value.splice(+el.dataset.delv, 1); markDirty(); render();
    });
    $("#addVal").onclick = () => {
      t.value = t.value || [];
      const next = t.value.reduce((m, v) => Math.max(m, v.number ?? 0), -1) + 1;
      t.value.push({name: "NEW_VALUE", number: next, description: ""});
      markDirty(); render();
    };
    return;
  }

  main.querySelectorAll("[data-b]").forEach(el => el.onchange = () => {
    const parts = el.dataset.b.split(".");
    const bit = t.bit[+parts[0]];
    if (parts[1] === "tel") {
      if (parts[2] === "group") {
        releaseBinding(bit.telemetry);
        bit.telemetry.group = el.value;
        bit.telemetry.id = allocId(el.value);
      } else bit.telemetry[parts[2]] = el.value;
    } else bit[parts[1]] = el.value;
    markDirty(); render();
  });
  main.querySelectorAll("[data-telon]").forEach(el => el.onclick = () => {
    const bit = t.bit[+el.dataset.telon];
    const group = (groupsEntry()?.group || [])[0]?.name || "";
    bit.telemetry = {group, field: bit.name, id: allocId(group)};
    markDirty(); render();
  });
  main.querySelectorAll("[data-teloff]").forEach(el => el.onclick = () => {
    const bit = t.bit[+el.dataset.teloff];
    releaseBinding(bit.telemetry); delete bit.telemetry;
    markDirty(); render();
  });
  main.querySelectorAll("[data-delb]").forEach(el => el.onclick = () => {
    const bit = t.bit[+el.dataset.delb];
    if (bit.telemetry?.group) releaseBinding(bit.telemetry);
    t.bit.splice(+el.dataset.delb, 1); markDirty(); render();
  });
  $("#addBit").onclick = () => {
    t.bit = t.bit || [];
    t.bit.push({name: "new_bit", description: ""});
    markDirty(); render();
  };
}

// ---- new-thing dialog ------------------------------------------------------

function openNewDialog() {
  const dlg = $("#newDialog");
  const body = $("#nd_body");
  if (mode === "messages") {
    $("#nd_title").textContent = "New message";
    body.innerHTML = `
      <div class="row"><div class="wide"><label>Name (UPPER_SNAKE)</label>
        <input id="nd_name" placeholder="HVC_PACK_STATUS"></div></div>
      <div class="row">
        <div><label>CAN ID (hex)</label><input id="nd_id" placeholder="0x400"></div>
        <div class="wide"><label>File</label><select id="nd_file">${
          messageFiles().map(f => `<option>${esc(f)}</option>`).join("")}
          <option value="__new__">new board file</option></select></div>
      </div>
      <div class="row" id="nd_newrow" style="display:none"><div class="wide">
        <label>Board name (lower case)</label><input id="nd_board" placeholder="inverter"></div></div>`;
    $("#nd_file").onchange = () => $("#nd_newrow").style.display =
      $("#nd_file").value === "__new__" ? "" : "none";
  } else if (mode === "types") {
    $("#nd_title").textContent = "New type";
    body.innerHTML = `
      <div class="row">
        <div><label>Kind</label><select id="nd_kind">
          <option value="enum">enum</option><option value="bitfield">bitfield</option></select></div>
        <div class="wide"><label>Name (UpperCamel)</label><input id="nd_name" placeholder="VcuState"></div>
      </div>`;
  } else {
    $("#nd_title").textContent = "New group";
    body.innerHTML = `<div class="row"><div class="wide">
      <label>Name (UpperCamel)</label><input id="nd_name" placeholder="Thermal"></div></div>`;
  }
  $("#nd_cancel").onclick = () => dlg.close();
  $("#nd_ok").onclick = () => createNew(dlg);
  dlg.showModal();
}

function createNew(dlg) {
  const name = $("#nd_name").value.trim();
  if (!name) return alert("Name is required.");
  if (mode === "messages") {
    const canId = parseInt($("#nd_id").value, 16);
    if (isNaN(canId)) return alert("CAN ID must be hex, e.g. 0x400.");
    let file = $("#nd_file").value;
    if (file === "__new__") {
      const board = $("#nd_board").value.trim().toLowerCase();
      if (!board) return alert("Board name is required.");
      file = `lib/spec/messages/${board}.textproto`;
    }
    const board = file.split("/").pop().replace(".textproto", "");
    const f = ensureFile(file);
    f.message = f.message || [];
    f.message.push({name, can_id: canId, from_board: board.toUpperCase(), to_boards: ["*"],
      bus: allOf("bus")[0]?.item.name || "", dlc: 8, frequency_hz: 0, signal: []});
    sel = {file, mi: f.message.length - 1};
    selSig = -1;
  } else if (mode === "types") {
    const kind = $("#nd_kind").value;
    const f = ensureFile(TYPES_FILE);
    if (kind === "enum") {
      f.enum_type = f.enum_type || [];
      f.enum_type.push({name, description: "", value: [{name: "UNKNOWN", number: 0, description: ""}]});
      sel = {kind: "enum", file: TYPES_FILE, idx: f.enum_type.length - 1};
    } else {
      f.bitfield_type = f.bitfield_type || [];
      f.bitfield_type.push({name, description: "", bit: [{name: "bit0", description: ""}]});
      sel = {kind: "bitfield", file: TYPES_FILE, idx: f.bitfield_type.length - 1};
    }
  } else {
    const reg = groupsEntry();
    if (!reg) return alert("No group registry file found.");
    reg.group.push({name, description: "", next_free_id: 1});
    sel = {idx: reg.group.length - 1};
  }
  dlg.close(); markDirty(); render();
}

// ---- server ----------------------------------------------------------------

function setStatus(cls, text) {
  const el = $("#status");
  el.className = `chip ${cls}`;
  el.textContent = text;
}
function scheduleValidate() {
  clearTimeout(validateTimer);
  validateTimer = setTimeout(runValidate, 400);
}

async function runValidate() {
  setStatus("busy", "checking");
  const res = await fetch("/api/validate", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({files: spec.files})});
  const body = await res.json();
  const issues = $("#issues");
  if (body.error) {
    setStatus("err", "error");
    issues.innerHTML = `<div class="issue err">${esc(body.error)}</div>`;
    return;
  }
  const changed = JSON.stringify(body.types) !== JSON.stringify(derivedTypes);
  derivedTypes = body.types || {};
  issues.innerHTML =
    body.errors.map(e => `<div class="issue err">${esc(e)}</div>`).join("") +
    body.warnings.map(w => `<div class="issue warn">${esc(w)}</div>`).join("") ||
    `<p class="muted">No issues.</p>`;
  if (body.errors.length) setStatus("err", `${body.errors.length} error(s)`);
  else if (body.warnings.length) setStatus("warn", `${body.warnings.length} warning(s)`);
  else setStatus("ok", "valid");
  $("#save").disabled = body.errors.length > 0;
  if (changed) render();
}

async function load() {
  setStatus("busy", "loading");
  spec = await (await fetch("/api/spec")).json();
  spec.dirty = false;
  $("#dirty").textContent = "";
  sel = null; selSig = -1;
  render();
  runValidate();
}

async function save() {
  setStatus("busy", "saving");
  const res = await fetch("/api/save", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({files: spec.files, digest: spec.digest})});
  const body = await res.json();
  if (!res.ok) { setStatus("err", "save failed"); alert(body.error); return; }
  const written = body.written.length;
  await load();
  setStatus("ok", written ? `saved ${written} file(s)` : "no changes");
}

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode; sel = null; selSig = -1; render();
});
$("#save").onclick = save;
$("#reload").onclick = () => { if (!spec?.dirty || confirm("Discard unsaved changes?")) load(); };
window.onbeforeunload = () => spec?.dirty ? "unsaved changes" : null;
load();
</script>
